<script>
document.addEventListener('DOMContentLoaded', function () {
  const toc = document.querySelector('nav[role="doc-toc"]');
  if (!toc) return;

  const tocLinks = Array.from(toc.querySelectorAll('a[href^="#"]'));
  if (!tocLinks.length) return;

  const targets = tocLinks
    .map(a => document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1))))
    .filter(Boolean);

  if (!targets.length) return;

  function setActive(el) {
    tocLinks.forEach(a => a.classList.remove('active'));
    const link = toc.querySelector('a[href="#' + CSS.escape(el.id) + '"]');
    if (link) link.classList.add('active');
  }

  function onScroll() {
    const threshold = window.innerHeight / 3;
    let current = targets[0];
    for (const el of targets) {
      if (el.getBoundingClientRect().top <= threshold) current = el;
    }
    setActive(current);
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
});
</script>
